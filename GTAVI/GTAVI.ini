[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Variables]
; >>> CHANGE THIS to resize everything (1 = original, 0.7 = smaller, 1.5 = bigger) <<<
Scale=0.85

Bg=9,10,15
Teal=47,224,200
BorderGrad=135 | 47,224,200,200 ; 0.0 | 47,224,200,25 ; 0.5 | 47,224,200,110 ; 1.0

[MeasureCountdown]
Measure=Script
ScriptFile=#CURRENTPATH#GTAVI.lua

; ---------- Styles ----------
[StyleNum]
X=(50*#Scale#)r
Y=(18*#Scale#)r
StringAlign=Center
FontFace=Segoe UI
FontSize=(30*#Scale#)
FontWeight=800
FontColor=#Teal#
StringEffect=Shadow
FontEffectColor=#Teal#,110
AntiAlias=1
DynamicVariables=1

[StyleLbl]
StringAlign=Center
FontFace=Segoe UI
FontSize=(7*#Scale#)
FontWeight=700
FontColor=255,255,255,130
AntiAlias=1

; ---------- Card ----------
[Card]
Meter=Shape
Shape=Rectangle 0,0,(520*#Scale#),(230*#Scale#),(28*#Scale#) | Fill Color #Bg#,235 | StrokeWidth (1.5*#Scale#) | Stroke LinearGradient BorderGrad

; ---------- Contour lines ----------
[Contours]
Meter=Shape
Shape=Ellipse (260*#Scale#),(115*#Scale#),(240*#Scale#),(100*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #Teal#,22
Shape2=Ellipse (260*#Scale#),(115*#Scale#),(205*#Scale#),(82*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #Teal#,18
Shape3=Ellipse (260*#Scale#),(115*#Scale#),(170*#Scale#),(64*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #Teal#,14
Shape4=Ellipse (260*#Scale#),(115*#Scale#),(135*#Scale#),(46*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #Teal#,10

; ---------- Title ----------
[Title]
Meter=String
MeasureName=MeasureCountdown
X=(260*#Scale#)
Y=(26*#Scale#)
StringAlign=Center
FontFace=Segoe UI
FontSize=(10*#Scale#)
FontWeight=700
FontColor=255,255,255,215
StringCase=Upper
AntiAlias=1
DynamicVariables=1
Text=[&MeasureCountdown:Title()]

; ---------- Tiles ----------
[TileDays]
Meter=Shape
X=(42*#Scale#)
Y=(66*#Scale#)
Shape=Rectangle 0,0,(100*#Scale#),(96*#Scale#),(20*#Scale#) | Fill Color 255,255,255,10 | StrokeWidth (1*#Scale#) | Stroke Color #Teal#,60

[TileHours]
Meter=Shape
X=(154*#Scale#)
Y=(66*#Scale#)
Shape=Rectangle 0,0,(100*#Scale#),(96*#Scale#),(20*#Scale#) | Fill Color 255,255,255,10 | StrokeWidth (1*#Scale#) | Stroke Color #Teal#,60

[TileMinutes]
Meter=Shape
X=(266*#Scale#)
Y=(66*#Scale#)
Shape=Rectangle 0,0,(100*#Scale#),(96*#Scale#),(20*#Scale#) | Fill Color 255,255,255,10 | StrokeWidth (1*#Scale#) | Stroke Color #Teal#,60

[TileSeconds]
Meter=Shape
X=(378*#Scale#)
Y=(66*#Scale#)
Shape=Rectangle 0,0,(100*#Scale#),(96*#Scale#),(20*#Scale#) | Fill Color #Teal#,28 | StrokeWidth (1*#Scale#) | Stroke Color #Teal#,140

; ---------- Numbers (positioned relative to each tile) ----------
[NumDays]
Meter=String
MeterStyle=StyleNum
X=(92*#Scale#)
Y=(84*#Scale#)
Text=[&MeasureCountdown:Days()]

[NumHours]
Meter=String
MeterStyle=StyleNum
X=(204*#Scale#)
Y=(84*#Scale#)
Text=[&MeasureCountdown:Hours()]

[NumMinutes]
Meter=String
MeterStyle=StyleNum
X=(316*#Scale#)
Y=(84*#Scale#)
Text=[&MeasureCountdown:Minutes()]

[NumSeconds]
Meter=String
MeterStyle=StyleNum
X=(428*#Scale#)
Y=(84*#Scale#)
FontColor=255,255,255,255
FontEffectColor=#Teal#,160
Text=[&MeasureCountdown:Seconds()]

; ---------- Labels ----------
[LblDays]
Meter=String
MeterStyle=StyleLbl
X=(92*#Scale#)
Y=(134*#Scale#)
Text=DAYS

[LblHours]
Meter=String
MeterStyle=StyleLbl
X=(204*#Scale#)
Y=(134*#Scale#)
Text=HOURS

[LblMinutes]
Meter=String
MeterStyle=StyleLbl
X=(316*#Scale#)
Y=(134*#Scale#)
Text=MINUTES

[LblSeconds]
Meter=String
MeterStyle=StyleLbl
X=(428*#Scale#)
Y=(134*#Scale#)
FontColor=#Teal#,200
Text=SECONDS

; ---------- Footer ----------
[Footer]
Meter=String
X=(260*#Scale#)
Y=(190*#Scale#)
StringAlign=Center
FontFace=Segoe UI
FontSize=(8*#Scale#)
FontWeight=600
FontColor=#Teal#,170
AntiAlias=1
Text=NOVEMBER 19, 2026